<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Main Header</title>

    <style>
        body {
            margin: 0;
            background-color: #ffffff;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            border-bottom: 1px solid #ccc;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo img {
            height: 50px;
        }

        .nav {
            display: grid;
            grid-template-columns: repeat(7, auto);
            gap: 15px;
            font-size: 14px;
        }

        .nav a {
            text-decoration: none;
            color: #007acc;
        }

        .nav a:hover {
            color: #00ffff;
        }

        .nav-column {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>

<body>

    <div class="header">

        <!-- Left Logo Section -->
        <div class="logo">
            <a href="trademark.htm" target="_blank">
                <img src="images/hdr_logo.gif" alt="Trademark">
            </a>

            <a href="index.htm">
                <img src="images/hdr_wrds.gif" alt="Shito-Ryu Karate">
            </a>
        </div>

        <!-- Navigation -->
        <div class="nav">

            <div class="nav-column">
                <a href="home.htm">Home</a>
                <a href="whatsnew.htm">What's New</a>
            </div>

            <div class="nav-column">
                <a href="locations/locations.htm">Locations</a>
                <a href="events/events.htm#current">Events</a>
            </div>

            <div class="nav-column">
                <a href="skills/skills.htm">Skills</a>
                <a href="glossary.htm">Glossary</a>
            </div>

            <div class="nav-column">
                <a href="heritage/heritage.htm">Heritage</a>
                <a href="bios/bios.htm">Biographies</a>
            </div>

            <div class="nav-column">
                <a href="gallery/gallery.htm">Gallery</a>
                <a href="links.htm">Links</a>
            </div>

            <div class="nav-column">
                <a href="search.htm">Search</a>
                <a href="contacts.htm">Contact Us</a>
            </div>

        </div>

    </div>

</body>
</html>
